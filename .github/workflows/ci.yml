name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

  # Publishing lives in this workflow because the NuGet trusted publishing policy names
  # ci.yml; moving it to its own file means editing the policy to match.
  publish:
    # A version is published only from its tag, and only after the tests pass on all three
    # operating systems. NuGet versions cannot be deleted, only unlisted.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing swaps this short-lived OIDC token for a NuGet key, so the
      # repository needs no long-lived secret.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The tag is the release: a mismatch here means the published version would not match
      # the tag people install by, so stop before anything reaches NuGet.
      - name: Check the tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match <Version>$version</Version>" >&2
            exit 1
          fi

      - run: dotnet pack src/OneNoteSystem.Cli --configuration Release --output artifacts

      - uses: NuGet/login@v1
        id: login
        with:
          user: DudeThatsErin

      - name: Push to NuGet
        run: >
          dotnet nuget push 'artifacts/*.nupkg'
          --api-key '${{ steps.login.outputs.NUGET_API_KEY }}'
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
